[project]
name = "investresearch-backend"
version = "0.1.0"
description = "个人日本股票研究与模拟交易系统 — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyarrow>=17.0",
    "pyqlib==0.9.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep tmp_path inside the project: the default %TEMP%\pytest-of-<user> tree
# is unreadable for this account (WinError 5), which fails any test using the
# tmp_path fixture before it runs.
addopts = "--basetemp=.pytest-tmp"
markers = [
    "slow: needs a real training run; skipped unless --slow is given",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
