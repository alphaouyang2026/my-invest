services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the backend test suite (see backend/tests/conftest.py).
  # No named volume — data resets on every `docker compose down`, deliberately.
  db-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits. backend and worker both
  # wait for it to succeed, so exactly one process migrates and neither starts
  # against a schema that isn't there yet.
  migrate:
    build: ./backend
    env_file: .env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # The venv is baked into the image and would otherwise be hidden by the
      # bind mount, so it needs a volume of its own. Anonymous, not named: a
      # named volume is shared by name, and migrate/backend/worker all run
      # `uv run`, so one starting up would re-sync — sometimes delete and
      # rebuild — the environment another was executing out of.
      - /app/.venv

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - research_assets:/app/var
      - ./.secrets/jquants_api_key:/run/secrets/jquants_api_key:ro

  # Single serial worker process — no Redis/Kafka/distributed task system
  # (spec §5.3). Same image as backend, different command.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["uv", "run", "python", "-m", "app.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
      - research_assets:/app/var
      - ./.secrets/jquants_api_key:/run/secrets/jquants_api_key:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      # Both are per-container state the bind mount would otherwise hide, and
      # neither is ever worth sharing: node_modules is installed for the
      # container's platform, and .next is build output — a host-side
      # `next dev` and this container fighting over .next/dev/lock is what
      # Docker Desktop reports as EACCES on Windows.
      - /app/node_modules
      - /app/.next

# Named only where the sharing is the point. Everything a single container
# owns privately is an anonymous volume at its mount site, so no second service
# can join it by writing the same name.
volumes:
  # Dev database — survives `docker compose down`; only `down -v` wipes it.
  pgdata:
  # Research output: the worker writes var/qlib-data and var/research-artifacts,
  # the backend reads them back for the API. Shared on purpose.
  research_assets:
