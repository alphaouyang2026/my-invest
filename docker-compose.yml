services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for the backend test suite (see backend/tests/conftest.py).
  # No named volume — data resets on every `docker compose down`, deliberately.
  db-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits. backend and worker both
  # wait for it to succeed, so exactly one process migrates and neither starts
  # against a schema that isn't there yet.
  migrate:
    build: ./backend
    env_file: .env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  # Single serial worker process — no Redis/Kafka/distributed task system
  # (spec §5.3). Same image as backend, different command.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["uv", "run", "python", "-m", "app.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  # Dev database — survives `docker compose down`; only `down -v` wipes it.
  pgdata:
  # Named (not anonymous) volumes so the venv/node_modules baked into each
  # image at build time get copied in on first use, instead of being hidden
  # by the bind-mounted source directory.
  backend_venv:
  frontend_node_modules:
